<div class="task-list">
  @if (tasks.length === 0) {
    <div class="empty-state">
      <p>No tasks yet. Add your first task to get started!</p>
    </div>
  } @else {
    @for (task of tasks; track task.id) {
      <app-task-item
        [task]="task"
        (editTask)="onEditTask($event)"
        (deleteTask)="onDeleteTask($event)"
        (statusChange)="onStatusChange($event)"
      ></app-task-item>
    }
  }
</div>
